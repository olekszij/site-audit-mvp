[build]
  command = "npm run build"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["views/**", "audit.js"]
  external_node_modules = [
    "axios",
    "cheerio",
    "ejs",
    "express",
    "serverless-http"
  ]

[[redirects]]
  from = "/audit"
  to = "/.netlify/functions/app"
  status = 200
